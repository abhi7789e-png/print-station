<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Srinibas Express Print</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --surface-card: rgba(255, 255, 255, 0.9);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-pink: #ec4899;
      --accent-purple: #8b5cf6;
      --shadow-glow: 0 10px 30px -5px rgba(168, 85, 247, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 10% 10%, #e0e7ff 0%, #fce7f3 40%, #f5f3ff 80%, #ffffff 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 15px;
      color: var(--text-main);
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--surface-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 28px 22px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08), var(--shadow-glow);
      border: 1px solid rgba(255, 255, 255, 0.8);
      position: relative;
    }

    /* Header Styling */
    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.1);
      color: #6366f1;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      background: var(--primary-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 22px;
    }

    /* Custom Upload Dropzone */
    .upload-zone {
      position: relative;
      border: 2px dashed #cbd5e1;
      border-radius: 20px;
      padding: 24px 15px;
      text-align: center;
      background: #fafafa;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 20px;
    }

    .upload-zone:hover {
      border-color: var(--accent-purple);
      background: #faf5ff;
    }

    .upload-zone.has-file {
      border-color: #22c55e;
      background: #f0fdf4;
    }

    .upload-icon {
      width: 48px;
      height: 48px;
      background: var(--primary-grad);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
      color: white;
      font-size: 20px;
      box-shadow: 0 8px 16px rgba(168, 85, 247, 0.25);
    }

    #fileInput {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .file-name {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-top: 5px;
      word-break: break-all;
    }

    /* Option Sections */
    .section-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #475569;
      margin: 14px 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Interactive Radio Grid Buttons */
    .pill-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .pill-grid.three-col {
      grid-template-columns: repeat(3, 1fr);
    }

    .pill-option input[type="radio"] {
      display: none;
    }

    .pill-option label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .pill-option input[type="radio"]:checked + label {
      background: var(--primary-grad);
      border-color: transparent;
      color: #ffffff;
      box-shadow: 0 6px 15px rgba(168, 85, 247, 0.3);
      transform: scale(1.02);
    }

    /* Send Button */
    .btn-submit {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: var(--primary-grad);
      color: white;
      font-family: inherit;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
      margin-top: 24px;
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #statusMessage {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
      font-weight: 600;
      color: #64748b;
    }
  </style>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="container">
    
    <div class="header-badge">
      <div class="pulse"></div> FAST PRINT STATION
    </div>

    <h1>Srinibas Print Hub</h1>
    <p class="subtitle">Select your preferences and send documents instantly.</p>

    <!-- Upload Dropzone -->
    <div class="upload-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".pdf,image/*" />
      <div class="upload-icon">📂</div>
      <div id="uploadPrompt" style="font-weight: 700; color: #475569; font-size: 14px;">Tap to select document</div>
      <div class="file-name" id="fileNameDisplay">PDF or Image (Max 15MB)</div>
    </div>

    <!-- 1. Paper Type Selection -->
    <div class="section-label">📄 1. Paper Format</div>
    <div class="pill-grid">
      <div class="pill-option">
        <input type="radio" name="paperType" id="p_a4" value="A4 Normal (75 GSM)" checked>
        <label for="p_a4">A4 Normal</label>
      </div>
      <div class="pill-option">
        <input type="radio" name="paperType" id="p_photo" value="A4 Glossy / Photo">
        <label for="p_photo">A4 Glossy</label>
      </div>
      <div class="pill-option">
        <input type="radio" name="paperType" id="p_legal" value="Legal Size">
        <label for="p_legal">Legal</label>
      </div>
      <div class="pill-option">
        <input type="radio" name="paperType" id="p_a3" value="A3 Large">
        <label for="p_a3">A3 Size</label>
      </div>
    </div>

    <!-- 2. Orientation Selection -->
    <div class="section-label">📐 2. Page Orientation</div>
    <div class="pill-grid">
      <div class="pill-option">
        <input type="radio" name="orientation" id="o_portrait" value="Portrait" checked>
        <label for="o_portrait">Portrait (Vertical)</label>
      </div>
      <div class="pill-option">
        <input type="radio" name="orientation" id="o_landscape" value="Landscape">
        <label for="o_landscape">Landscape (Horizontal)</label>
      </div>
    </div>

    <!-- 3. Color Mode Selection -->
    <div class="section-label">🎨 3. Color Selection</div>
    <div class="pill-grid">
      <div class="pill-option">
        <input type="radio" name="colorMode" id="c_bw" value="Black & White" checked>
        <label for="c_bw">Black & White</label>
      </div>
      <div class="pill-option">
        <input type="radio" name="colorMode" id="c_color" value="Color Print">
        <label for="c_color">Full Color</label>
      </div>
    </div>

    <!-- Submit Button -->
    <button class="btn-submit" id="sendBtn" onclick="uploadAndSend()">
      🚀 Send Document to Shop
    </button>
    
    <div id="statusMessage"></div>

  </div>

  <script>
    // Paste your Firebase Config keys here:
      const firebaseConfig = {
       apiKey: "AIzaSyBOE1m_P-cnB-D79QKh0Hkp4VT-bG0BcuY",
  authDomain: "auto-print-8e959.firebaseapp.com",
  databaseURL: "https://auto-print-8e959-default-rtdb.firebaseio.com",
  projectId: "auto-print-8e959",
  appId: "1:718790139534:web:0285bace5f866e10d633df"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Visual File Selection Update
    const fileInput = document.getElementById("fileInput");
    const fileNameDisplay = document.getElementById("fileNameDisplay");
    const uploadPrompt = document.getElementById("uploadPrompt");
    const dropZone = document.getElementById("dropZone");

    fileInput.addEventListener("change", () => {
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        uploadPrompt.innerText = "File Selected ✅";
        fileNameDisplay.innerText = `${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
        dropZone.classList.add("has-file");
      }
    });

    function uploadAndSend() {
      const file = fileInput.files[0];
      const paperType = document.querySelector('input[name="paperType"]:checked').value;
      const orientation = document.querySelector('input[name="orientation"]:checked').value;
      const colorMode = document.querySelector('input[name="colorMode"]:checked').value;
      const status = document.getElementById("statusMessage");
      const btn = document.getElementById("sendBtn");

      if (!file) return alert("Please select a file to print first!");

      btn.disabled = true;
      btn.innerHTML = "⏳ Transmitting File...";
      status.innerText = "Preparing document for Srinibas...";

      const reader = new FileReader();
      reader.onload = function(e) {
        const fileBase64 = e.target.result;

        db.ref('print_jobs').push({
          fileName: file.name,
          fileType: file.type,
          fileData: fileBase64,
          paperType: paperType,
          orientation: orientation,
          colorMode: colorMode,
          timestamp: Date.now()
        }).then(() => {
          status.innerHTML = "<span style='color:#16a34a;'>🎉 File Received by Shop! Ready to print.</span>";
          btn.innerHTML = "✅ Sent Successfully";
        }).catch((err) => {
          alert("Error: " + err.message);
          btn.disabled = false;
          btn.innerHTML = "🚀 Send Document to Shop";
          status.innerText = "";
        });
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
